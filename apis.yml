name: The Mind Company
description: >-
  The Mind Company is a consumer mental-fitness company that builds a multi-app
  platform for cognitive and emotional wellbeing. Its apps include Elevate
  (cognitive training across memory, vocabulary, math, and more), Balance
  (personalized meditation for sleep, stress, and focus), and Spark (puzzle-based
  learning). The company is a portfolio company of Felicis and was added to the
  API Evangelist network as a company profile. As a direct-to-consumer mobile app
  business, The Mind Company publishes no public API, developer portal, SDKs, or
  developer documentation; this profile captures its identity, public web
  properties, and probed security posture.
